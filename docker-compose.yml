# Local infrastructure for development: PostgreSQL, MongoDB, Redis.
# Start:  docker compose up -d      Stop: docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: rx-postgres
    environment:
      POSTGRES_USER: rx
      POSTGRES_PASSWORD: rx_dev_password
      POSTGRES_DB: rx_clinic
      TZ: Asia/Manila
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rx -d rx_clinic"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: rx-mongo
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rx-redis
    # AOF persistence so queued jobs and refresh tokens survive a restart
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
  redisdata:
